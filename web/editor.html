<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>html,body,#m{margin:0;height:100%;overflow:hidden}</style>
</head>
<body>
<div id="m"></div>
<script src="/web/vendor/monaco/loader.js" onerror="document.body.textContent='Monaco missing. Run: just vendor-monaco'"></script>
<script>
const vs = "/web/vendor/monaco";
self.MonacoEnvironment = {
  getWorkerUrl: function () {
    const base = location.origin + vs;
    const body = "self.MonacoEnvironment={baseUrl:'" + base + "/'};importScripts('" + base + "/base/worker/workerMain.js');";
    return "data:text/javascript;charset=utf-8," + encodeURIComponent(body);
  }
};
require.config({ paths: { vs: vs } });
require(["vs/editor/editor.main"], function () {
  const models = Object.create(null);
  const editor = monaco.editor.create(document.getElementById("m"), {
    value: "",
    language: "markdown",
    automaticLayout: true,
    wordWrap: "on",
    theme: "vs"
  });

  function uri(path) {
    return monaco.Uri.parse("inmemory://s/" + path.split("/").map(encodeURIComponent).join("/"));
  }

  function pathOf(model) {
    for (const p in models) {
      if (models[p] === model) return p;
    }
    return "";
  }

  function theme(dark) {
    monaco.editor.setTheme(dark ? "vs-dark" : "vs");
  }

  window.snipOpen = function (path, text, dark) {
    theme(dark);
    let m = models[path];
    if (!m) {
      m = monaco.editor.createModel(text || "", "markdown", uri(path));
      models[path] = m;
      m.onDidChangeContent(function () {
        window.chrome.webview.postMessage(JSON.stringify({ t: "dirty", p: path }));
      });
    }
    editor.setModel(m);
  };

  window.snipSwitch = function (path, dark) {
    if (dark === true || dark === false) theme(dark);
    const m = models[path];
    if (m) editor.setModel(m);
  };

  window.snipClose = function (path) {
    const m = models[path];
    if (!m) return;
    if (editor.getModel() === m) editor.setModel(null);
    m.dispose();
    delete models[path];
  };

  window.snipSet = function (text, dark) {
    theme(dark);
    editor.setValue(text || "");
  };

  window.snipGet = function () {
    const p = pathOf(editor.getModel());
    window.chrome.webview.postMessage(JSON.stringify({ t: "save", p: p, v: editor.getValue() }));
  };

  window.snipSaveAll = function () {
    const files = [];
    for (const p in models) {
      files.push({ p: p, v: models[p].getValue() });
    }
    window.chrome.webview.postMessage(JSON.stringify({ t: "saveall", files: files }));
  };

  window.snipFmt = function (kind) {
    const model = editor.getModel();
    if (!model) return true;
    const sel = editor.getSelection();
    const range = new monaco.Range(sel.startLineNumber, sel.startColumn, sel.endLineNumber, sel.endColumn);
    const t = model.getValueInRange(range);
    function around(left, right) {
      const sc = range.startColumn;
      const ec = range.endColumn;
      const sl = range.startLineNumber;
      const el = range.endLineNumber;
      const before = sc > left.length
        ? model.getValueInRange(new monaco.Range(sl, sc - left.length, sl, sc))
        : "";
      const afterEnd = ec + right.length;
      const after = afterEnd <= model.getLineMaxColumn(el)
        ? model.getValueInRange(new monaco.Range(el, ec, el, afterEnd))
        : "";
      return before === left && after === right;
    }
    function wrap(left, right) {
      if (t.length >= left.length + right.length && t.slice(0, left.length) === left && t.slice(-right.length) === right) {
        editor.executeEdits("snip", [{ range: range, text: t.slice(left.length, t.length - right.length) }]);
        return;
      }
      if (around(left, right)) {
        const outer = new monaco.Range(
          range.startLineNumber, range.startColumn - left.length,
          range.endLineNumber, range.endColumn + right.length
        );
        editor.executeEdits("snip", [{ range: outer, text: t }]);
        return;
      }
      editor.executeEdits("snip", [{ range: range, text: left + t + right }]);
    }
    function prefix(p) {
      const edits = [];
      for (let line = range.startLineNumber; line <= range.endLineNumber; line++) {
        const content = model.getLineContent(line);
        if (content.indexOf(p) === 0) {
          edits.push({ range: new monaco.Range(line, 1, line, 1 + p.length), text: "" });
        } else {
          edits.push({ range: new monaco.Range(line, 1, line, 1), text: p });
        }
      }
      editor.executeEdits("snip", edits);
    }
    if (kind === "bold") wrap("**", "**");
    else if (kind === "italic") wrap("*", "*");
    else if (kind === "strike") wrap("~~", "~~");
    else if (kind === "code") wrap(t.indexOf("\n") >= 0 || around("```\n", "\n```") ? "```\n" : "`", t.indexOf("\n") >= 0 || around("```\n", "\n```") ? "\n```" : "`");
    else if (kind === "link") {
      const m = /^\[([\s\S]*)\]\([^)]*\)$/.exec(t);
      if (m) editor.executeEdits("snip", [{ range: range, text: m[1] }]);
      else wrap("[", "](url)");
    } else if (kind === "heading") {
      const edits = [];
      for (let line = range.startLineNumber; line <= range.endLineNumber; line++) {
        const content = model.getLineContent(line);
        const h = /^(#+ )/.exec(content);
        if (h) edits.push({ range: new monaco.Range(line, 1, line, 1 + h[1].length), text: "" });
        else edits.push({ range: new monaco.Range(line, 1, line, 1), text: "# " });
      }
      editor.executeEdits("snip", edits);
    } else if (kind === "quote") prefix("> ");
    else if (kind === "list") prefix("- ");
    else if (kind === "olist") prefix("1. ");
    editor.focus();
    return true;
  };

  editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
    window.snipGet();
  });

  window.chrome.webview.postMessage(JSON.stringify({ t: "ready" }));
});
</script>
</body>
</html>
