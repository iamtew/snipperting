<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>html,body,#m{margin:0;height:100%;overflow:hidden}</style>
</head>
<body>
<div id="m"></div>
<script src="/web/vendor/monaco/loader.js" onerror="document.body.textContent='Monaco missing. Run: just vendor-monaco'"></script>
<script>
const vs = "/web/vendor/monaco";
if (window.require) {
  require.config({ paths: { vs } });
  require(["vs/editor/editor.main"], function () {
    const editor = monaco.editor.create(document.getElementById("m"), {
      value: "",
      language: "markdown",
      automaticLayout: true,
      wordWrap: "on",
      theme: "vs"
    });
    window.snipSet = function (text, dark) {
      editor.setValue(text || "");
      monaco.editor.setTheme(dark ? "vs-dark" : "vs");
    };
    window.snipGet = function () {
      window.chrome.webview.postMessage(JSON.stringify({ t: "save", v: editor.getValue() }));
    };
    window.chrome.webview.postMessage(JSON.stringify({ t: "ready" }));
  });
}
</script>
</body>
</html>
