<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>snipperting help</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <div class="page help">
    <article id="manual">Loading…</article>
  </div>
  <script src="/web/app.js"></script>
  <script>
    applyTheme();
    api("/api/manual").then((t) => {
      document.getElementById("manual").innerHTML = mdLite(t);
    }).catch((e) => { document.getElementById("manual").textContent = e.message; });
  </script>
</body>
</html>
