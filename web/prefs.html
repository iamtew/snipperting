<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>snipperting preferences</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <div class="page">
    <h1>Preferences</h1>
    <div class="tabs">
      <button type="button" data-tab="general" aria-selected="true">General</button>
      <button type="button" data-tab="bulk">Bulk Edit</button>
    </div>
    <section id="general">
      <p>
        <label>Data directory<br>
          <input id="dataDir" style="width:100%" />
        </label>
      </p>
      <p>
        <label>Theme<br>
          <select id="theme">
            <option value="system">System</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </p>
      <button type="button" id="save">Save</button>
    </section>
    <section id="bulk" hidden>
      <div id="bulkList"></div>
    </section>
  </div>
  <script src="/web/app.js"></script>
  <script>
    const general = document.getElementById("general");
    const bulk = document.getElementById("bulk");
    const bulkList = document.getElementById("bulkList");
    const dataDir = document.getElementById("dataDir");
    const theme = document.getElementById("theme");

    document.querySelectorAll(".tabs button").forEach((b) => {
      b.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b ? "true" : "false"));
        const t = b.getAttribute("data-tab");
        general.hidden = t !== "general";
        bulk.hidden = t !== "bulk";
      });
    });

    document.getElementById("save").addEventListener("click", async () => {
      await api("/api/config", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ dataDir: dataDir.value, theme: theme.value }),
      });
      await applyTheme();
    });

    function walk(nodes, depth, folded, host) {
      for (const n of nodes || []) {
        if (n.type === "dir") {
          const row = document.createElement("div");
          row.className = "bulk-row indent-" + Math.min(depth, 3);
          const open = document.createElement("button");
          open.type = "button";
          open.textContent = folded.has(n.path) ? "▸ " + n.name : "▾ " + n.name;
          open.addEventListener("click", () => {
            if (folded.has(n.path)) folded.delete(n.path); else folded.add(n.path);
            drawBulk();
          });
          row.appendChild(open);
          host.appendChild(row);
          if (!folded.has(n.path)) walk(n.children, depth + 1, folded, host);
          continue;
        }
        const row = document.createElement("div");
        row.className = "bulk-row indent-" + Math.min(depth, 3);
        const left = document.createElement("div");
        left.className = "name";
        left.textContent = n.name + (n.label ? " — " + n.label : "");
        const right = document.createElement("div");
        right.className = "row";
        const act = document.createElement("button");
        act.type = "button";
        act.textContent = n.action;
        act.addEventListener("click", () => patch(n.path, { action: opposite(n.action) }));
        const st = document.createElement("button");
        st.type = "button";
        st.textContent = n.enabled ? "on" : "off";
        st.addEventListener("click", () => patch(n.path, { enabled: !n.enabled }));
        const hid = document.createElement("button");
        hid.type = "button";
        hid.textContent = n.hidden ? "hidden" : "shown";
        hid.addEventListener("click", () => patch(n.path, { hidden: !n.hidden }));
        right.append(act, st, hid);
        row.append(left, right);
        host.appendChild(row);
      }
    }

    const folded = new Set();
    let tree = { children: [] };

    async function patch(path, fields) {
      await api("/api/bulk", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: [{ path, ...fields }] }),
      });
      tree = await api("/api/snippets");
      drawBulk();
    }

    function drawBulk() {
      bulkList.innerHTML = "";
      walk(tree.children, 0, folded, bulkList);
    }

    async function boot() {
      const c = await applyTheme();
      dataDir.value = c.dataDir || "";
      theme.value = c.theme || "system";
      tree = await api("/api/snippets");
      (tree.children || []).filter((n) => n.type === "dir").forEach((n) => folded.add(n.path));
      drawBulk();
    }
    boot().catch((e) => { bulkList.textContent = e.message; });
  </script>
</body>
</html>
