name: installer

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  dist:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@v2
      - name: Inno Setup
        run: choco install innosetup --yes --no-progress
      - run: just vendor-monaco
      - run: just dist
      - uses: actions/upload-artifact@v4
        with:
          name: snipperting-${{ github.ref_name }}
          path: |
            dist/snipperting-setup.exe
            dist/snipperting-*.zip
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/snipperting-setup.exe "dist/snipperting-${{ github.ref_name }}.zip" --title "${{ github.ref_name }}" --generate-notes
