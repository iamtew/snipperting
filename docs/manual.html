<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snipperting manual</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --fg: #1c1917;
      --muted: #57534e;
      --chip: #e7e5e4;
      --accent: #0f766e;
      --rule: #d6d3d1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --fg: #f4f1ea;
        --muted: #a8a29e;
        --chip: #292524;
        --accent: #0f766e;
        --rule: #44403c;
      }
    }
    html, body { margin: 0; background: var(--bg); color: var(--fg); }
    body { font: 17px/1.6 "Segoe UI", system-ui, sans-serif; }
    header, main { max-width: 42rem; margin: 0 auto; padding: 0 1.5rem; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 1.5rem;
    }
    .brand {
      display: flex; align-items: center; gap: 0.75rem;
      color: inherit; text-decoration: none; font-weight: 600; letter-spacing: -0.02em;
    }
    .brand .logo {
      width: 48px; height: 48px; background: currentColor;
      -webkit-mask: url(logo.svg) no-repeat center / contain;
      mask: url(logo.svg) no-repeat center / contain;
    }
    header nav {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem;
    }
    header nav a {
      display: inline-flex; align-items: center; gap: 0.35rem;
      color: var(--accent); text-decoration: none;
    }
    header nav a:hover { text-decoration: underline; }
    header nav .i {
      width: 1.15rem; height: 1.15rem; background: currentColor;
      -webkit-mask: var(--icon) no-repeat center / contain;
      mask: var(--icon) no-repeat center / contain;
    }
    main { padding-bottom: 4rem; }
    .toc {
      margin: 1.75rem 0 2rem; padding: 1rem 1.25rem;
      background: var(--chip); border-radius: 12px;
    }
    .toc[hidden] { display: none; }
    .toc p { margin: 0 0 0.5rem; font-weight: 600; }
    .toc ul { margin: 0; padding-left: 1.2rem; }
    .toc a { color: var(--accent); text-decoration: none; }
    .toc a:hover { text-decoration: underline; }
    article h1 { font-size: 2rem; line-height: 1.2; letter-spacing: -0.03em; margin: 1.25rem 0 0.75rem; }
    article h2 {
      font-size: 1.25rem; margin-top: 2.25rem; padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--rule);
    }
    article a { color: var(--accent); }
    article code {
      font-family: Consolas, "Cascadia Code", ui-monospace, monospace;
      background: var(--chip); padding: 0.12em 0.4em; border-radius: 4px; font-size: 0.9em;
    }
    article pre {
      background: var(--chip); padding: 1rem 1.1rem; border-radius: 12px; overflow: auto;
    }
    article pre code { background: none; padding: 0; }
    article ul { padding-left: 1.2rem; }
    article li { margin: 0.35rem 0; }
    .err { color: var(--muted); }
  </style>
  <script src="vendor/marked.min.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="index.html">
      <span class="logo" role="img" aria-label="snipperting"></span>
      snipperting
    </a>
    <nav aria-label="Site">
      <a href="index.html">Home</a>
      <a href="https://github.com/iamtew/snipperting" target="_blank" rel="noopener noreferrer">
        <span class="i" style="--icon: url(vendor/tabler/brand-github.svg)"></span>
        Source
      </a>
      <a href="https://github.com/iamtew/snipperting/releases/latest" target="_blank" rel="noopener noreferrer">
        <span class="i" style="--icon: url(vendor/tabler/download.svg)"></span>
        Latest release
      </a>
      <a href="https://github.com/iamtew/snipperting/issues" target="_blank" rel="noopener noreferrer">
        <span class="i" style="--icon: url(vendor/tabler/bug.svg)"></span>
        Issues
      </a>
    </nav>
  </header>
  <main>
    <article id="md">Loading the manual…</article>
    <nav class="toc" id="toc" hidden></nav>
  </main>
  <script>
    (async function () {
      const article = document.getElementById("md");
      const tocNav = document.getElementById("toc");
      try {
        const res = await fetch("MANUAL.md");
        if (!res.ok) throw new Error(res.status + " " + res.statusText);
        const src = await res.text();
        article.innerHTML = marked.parse(src);
        const used = {};
        const items = [];
        article.querySelectorAll("h2, h3").forEach(function (h) {
          let id = h.textContent.toLowerCase().trim()
            .replace(/[^\p{L}\p{N}]+/gu, "-")
            .replace(/^-+|-+$/g, "");
          if (used[id]) id = id + "-" + (used[id] += 1);
          else used[id] = 1;
          h.id = id;
          items.push('<li><a href="#' + id + '">' + h.textContent + "</a></li>");
        });
        if (items.length) {
          tocNav.innerHTML = "<p>Contents</p><ul>" + items.join("") + "</ul>";
          tocNav.hidden = false;
          const firstH2 = article.querySelector("h2");
          if (firstH2) article.insertBefore(tocNav, firstH2);
          else article.appendChild(tocNav);
        }
      } catch (e) {
        article.className = "err";
        article.textContent = "Could not load MANUAL.md. " + e;
      }
    })();
  </script>
</body>
</html>
